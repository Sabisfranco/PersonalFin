<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a1838">
<link rel="manifest" href="manifest.json">
<title>PersonalFin</title>

<style>
:root{--wine:#7a1838;--wine2:#9d2851;--bg:#f7f4f5;--card:#fff;--txt:#272126;--muted:#777078;--line:#eadfe4;--green:#287a58;--red:#b52a2a;--gold:#a86d14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;padding:18px 16px 15px;position:sticky;top:0;z-index:20;box-shadow:0 3px 15px #0002}
header h1{margin:0;font-size:23px}
header p{margin:3px 0 0;font-size:12px;opacity:.86}
.wrap{max-width:1100px;margin:auto;padding:14px 12px 90px}
.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;position:sticky;top:68px;background:var(--bg);z-index:10}
.tabs button{white-space:nowrap}
.tab{border:0;border-radius:11px;padding:9px 12px;background:#eee5e8;color:var(--wine);font-weight:700}
.tab.active{background:var(--wine);color:#fff}
.view{display:block}
.view[hidden]{display:none}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.monthbar button{width:42px}
.monthbar strong{text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 2px 10px #00000008}
.label{font-size:11px;color:var(--muted)}
.big{font-size:21px;font-weight:800;margin-top:4px}
.green{color:var(--green)}
.red{color:var(--red)}
.gold{color:var(--gold)}
section{margin-top:13px}
.title{font-size:16px;font-weight:800;margin:0 0 8px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.table th:first-child,.table td:first-child{text-align:left;position:sticky;left:0;background:#fff}
.table th{background:#f4ecef;color:var(--wine)}
.table input{width:90px;padding:7px;border:1px solid var(--line);border-radius:8px;text-align:right}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.form .full{grid-column:1/-1}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}
button{border:0;border-radius:11px;padding:10px 13px;background:var(--wine);color:#fff;font-weight:750;cursor:pointer}
.secondary{background:#eee5e8;color:var(--wine)}
.danger{background:#fbe7e7;color:var(--red)}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bar{height:9px;background:#eee7ea;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--wine);border-radius:99px}
.rows .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rows .row:last-child{border:0}
.rows small{display:block;color:var(--muted);margin-top:2px}
.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#f0e5e9;color:var(--wine);font-size:10px;font-weight:700}
.dangerText{color:var(--red)}
.successText{color:var(--green)}
@media(max-width:760px){
.grid,.kpis{grid-template-columns:repeat(2,1fr)}
.form{grid-template-columns:1fr 1fr}
.tabs{top:62px}
.big{font-size:19px}
}
@media(max-width:480px){
.form{grid-template-columns:1fr}
.form .full{grid-column:auto}
}
</style>
</head>

<body>

<header>
<h1>PersonalFin</h1>
<p>Controle financeiro pessoal • dados salvos neste aparelho</p>
</header>

<div class="wrap">
<nav class="tabs" id="tabs"></nav>
<div id="app"></div>
</div>

<script>

const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const fullMonths=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);

const n=v=>Number(v)||0;

const id=()=>Date.now()+Math.random();

const initial={
year:new Date().getFullYear(),
month:new Date().getMonth(),
entries:[],
cards:{casa:[],pessoal:[]},
recurring:[
['Gastos fixos','Financiamento da casa','Pix',711,'Sim','Compromisso fixo'],
['Gastos fixos','Financiamento do carro','Pix',816.11,'Sim','Compromisso fixo'],
['Gastos fixos','Condomínio','Pix',492,'Sim','Compromisso fixo'],
['Gastos fixos','Energia elétrica','Pix',46.79,'Sim','Compromisso fixo'],
['Gastos fixos','Internet','Pix',50,'Sim','Compromisso fixo'],
['Gastos fixos','IPTU','Pix',50.74,'Sim','Compromisso fixo'],
['Gastos fixos','IPVA — minha metade','Pix',125,'Sim','Compromisso fixo'],
['Cartão Casa','Seguro do carro','Cartão Casa',127.04,'Sim','Recorrente'],
['Cartão Casa','Gasolina','Cartão Casa',80,'Sim','Valor de referência'],
['Cartão Casa','iCloud Familiar','Cartão Casa',33,'Sim','Recorrente'],
['Cartão Casa','Creche','Cartão Casa',0,'Não','Compra grande / parcelada — lançar no cartão quando comprar'],
['Cartão Casa','Ração da Panqueca','Cartão Casa',0,'Não','Pacote grande / parcelado — lançar no cartão quando comprar'],
['Cartão Casa','Areia','Cartão Casa',0,'Não','Pacotes grandes / parcelado — lançar no cartão quando comprar'],
['Cartão Pessoal','Seguro Prudential','Cartão Pessoal',236.28,'Sim','Recorrente'],
['Cartão Pessoal','Taxa Personal','Cartão Pessoal',99.90,'Sim','Recorrente'],
['Cartão Pessoal','Spotify — Lazer','Cartão Pessoal',40.90,'Sim','Lazer / recorrente'],
['Cartão Pessoal','Wellhub/Gympass — Lazer','Cartão Pessoal',189.90,'Sim','Lazer / recorrente'],
['Cartão Pessoal','Claro Flex','Cartão Pessoal',44.90,'Sim','Recorrente'],
['Cartão Pessoal','MFIT','Cartão Pessoal',34.90,'Sim','Recorrente']
],
inputs:{
personal:['Juliana','João','Rafa','Pri e Isa','Neuza','Dani','Giovanna','Ana Velasco','Luís Lunguinho'],
consultoria:['Bruno Fitaroni','Isadora Rodrigues','Raissa Nogueira','Marcos Marin'],
app:0
},
settings:{
salary:0,
reservePct:5,
investPct:10,
emergencyMonths:6
}
};

let db=JSON.parse(localStorage.getItem('personalfin_complete_v1')||'null')||initial;

let tab='painel';


/* =========================
   SALVAR
   ========================= */

/*
Mantém a posição horizontal das tabelas depois do render.
Assim, se você estiver em Outubro e lançar um valor,
a tabela continua exatamente em Outubro.
*/

function save(){

const scrollPositions=[
...document.querySelectorAll('.tablewrap')
].map(el=>el.scrollLeft);

localStorage.setItem(
'personalfin_complete_v1',
JSON.stringify(db)
);

render();

requestAnimationFrame(()=>{

const tables=[
...document.querySelectorAll('.tablewrap')
];

tables.forEach((el,i)=>{

if(scrollPositions[i]!==undefined){
el.scrollLeft=scrollPositions[i];
}

});

});

}


function currentMonth(){
return db.month
}

function ym(){
return db.year+'-'+String(db.month+1).padStart(2,'0')
}

function monthNav(){

return `<div class="monthbar">

<button class="secondary" onclick="moveMonth(-1)">‹</button>

<strong>${fullMonths[db.month]} ${db.year}</strong>

<button class="secondary" onclick="moveMonth(1)">›</button>

</div>`

}

function moveMonth(x){

db.month+=x;

if(db.month<0){
db.month=11;
db.year--
}

if(db.month>11){
db.month=0;
db.year++
}

save()

}


function tabs(){

let a=[
['painel','Painel'],
['entradas','Entradas'],
['saidas','Saídas'],
['casa','Cartão Casa'],
['pessoal','Cartão Pessoal'],
['recorrentes','Recorrentes'],
['reserva','Reserva']
];

document.getElementById('tabs').innerHTML=
a.map(x=>
`<button class="tab ${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`
).join('')

}


/* =========================
   RENDA
   ========================= */

function income(){

const m=ym();

const personal=sumInputs('personal',db.month);

const consultoria=sumInputs('consultoria',db.month);

const aplicativo=n(db.inputs.app);

const extras=db.entries
.filter(e=>e.ym===m&&e.type==='entrada')
.reduce((s,e)=>s+n(e.amount),0);

return personal+consultoria+aplicativo+extras;

}


/* =========================
   SAÍDAS
   ========================= */

function pixFixed(){

return db.recurring
.filter(r=>r[0]==='Gastos fixos'&&r[4]==='Sim')
.reduce((s,r)=>s+n(r[3]),0)

}

function cardTotal(which){

return db.cards[which]
.filter(e=>e.months.includes(ym()))
.reduce((s,e)=>s+n(e.value),0)

}

function cardAll(which){

return db.cards[which]
.filter(e=>e.month===ym())
.reduce((s,e)=>s+n(e.value),0)

}

function investments(){

return db.entries
.filter(e=>e.ym===ym()&&e.type==='saida'&&e.category==='Investimentos')
.reduce((s,e)=>s+n(e.amount),0)

}

function reserve(){

return db.entries
.filter(e=>e.ym===ym()&&e.type==='saida'&&e.category==='Reserva de emergência')
.reduce((s,e)=>s+n(e.amount),0)

}

function totalOut(){

return pixFixed()
+cardAll('casa')
+cardAll('pessoal')
+investments()
+reserve()
+db.entries
.filter(e=>
e.ym===ym()&&
e.type==='saida'&&
e.category!=='Investimentos'&&
e.category!=='Reserva de emergência'&&
e.form==='Pix'
)
.reduce((s,e)=>s+n(e.amount),0)

}


/* =========================
   PAINEL
   ========================= */

function panel(){

let inc=income();

let fixed=pixFixed();

let cc=cardAll('casa');

let cp=cardAll('pessoal');

let inv=investments();

let res=reserve();

let out=
fixed+
cc+
cp+
inv+
res+
db.entries
.filter(e=>
e.ym===ym()&&
e.type==='saida'&&
e.form==='Pix'&&
e.category!=='Investimentos'&&
e.category!=='Reserva de emergência'
)
.reduce((s,e)=>s+n(e.amount),0);

let bal=Math.max(0,inc-out);

let pct=inc?cc+cp:0;

let dist=[
['Gastos fixos',fixed],
['Cartão Casa',cc],
['Cartão Pessoal',cp],
['Investimentos',inv],
['Reserva',res]
].filter(x=>x[1]>0);

return monthNav()+`

<div class="grid">

<div class="card">
<div class="label">Renda</div>
<div class="big green">${money(inc)}</div>
</div>

<div class="card">
<div class="label">Saídas</div>
<div class="big red">${money(out)}</div>
</div>

<div class="card">
<div class="label">Disponível</div>
<div class="big green">${money(bal)}</div>
</div>

<div class="card">
<div class="label">Cartões / renda</div>
<div class="big">${inc?(pct/inc*100).toFixed(1):0}%</div>
</div>

</div>

<section>

<h2 class="title">Saúde financeira</h2>

<div class="kpis">

<div class="card">
<div class="label">Investimentos</div>
<div class="big gold">${money(inv)}</div>
<small>${db.settings.investPct}% da renda como referência</small>
</div>

<div class="card">
<div class="label">Reserva</div>
<div class="big gold">${money(res)}</div>
<small>${db.settings.reservePct}% da renda como mínimo</small>
</div>

<div class="card">
<div class="label">Meta reserva</div>
<div class="big">${money(averageFixed()*db.settings.emergencyMonths)}</div>
<small>${db.settings.emergencyMonths} meses de gastos essenciais</small>
</div>

<div class="card">
<div class="label">Cobertura atual</div>
<div class="big">${averageFixed()?((reserveAccum()/averageFixed())).toFixed(2):'0'} meses</div>
<small>baseada na reserva acumulada</small>
</div>

</div>

</section>

<section>

<h2 class="title">Distribuição do mês</h2>

<div class="card rows">

${dist.map(x=>`
<div class="row">
<span>${x[0]}</span>
<b>${money(x[1])}</b>
</div>
`).join('')||'<div class="note">Nenhuma saída registrada.</div>'}

</div>

</section>

<section>

<h2 class="title">Regra do cartão</h2>

<div class="card note">
Compra ou parcela = uma linha no cartão.
O total do cartão alimenta automaticamente Saídas e o Painel.
Recorrentes é apenas cadastro de referência e não é somado duas vezes.
</div>

</section>

`

}

function averageFixed(){
return pixFixed()
}

function reserveAccum(){

return db.entries
.filter(e=>e.type==='saida'&&e.category==='Reserva de emergência')
.reduce((s,e)=>s+n(e.amount),0)

}


/* =========================
   ENTRADAS
   ========================= */

function inputTable(){

let names=db.inputs.personal;

return monthNav()+`

<section>

<h2 class="title">Personal</h2>

<div class="tablewrap">

<table class="table">

<thead>

<tr>
<th>Fonte / pessoa</th>
${months.map(m=>`<th>${m}</th>`).join('')}
<th>Observação</th>
</tr>

</thead>

<tbody>

${names.map((name,i)=>`

<tr>

<td>${name}</td>

${months.map((m,j)=>`

<td>

<input
type="number"
step="0.01"
value="${inputValue('personal',i,j)}"
onchange="setInput('personal',${i},${j},this.value)"
>

</td>

`).join('')}

<td>

${name==='Luís Lunguinho'
?'R$ 200 em dinheiro + R$ 680 em permuta'
:''}

</td>

</tr>

`).join('')}

<tr>

<th>TOTAL PERSONAL</th>

${months.map((m,j)=>`

<th>${money(sumInputs('personal',j))}</th>

`).join('')}

<th></th>

</tr>

</tbody>

</table>

</div>

</section>


<section>

<h2 class="title">Consultoria online</h2>

<div class="tablewrap">

<table class="table">

<thead>

<tr>
<th>Aluno</th>
${months.map(m=>`<th>${m}</th>`).join('')}
<th>Observação</th>
</tr>

</thead>

<tbody>

${db.inputs.consultoria.map((name,i)=>`

<tr>

<td>${name}</td>

${months.map((m,j)=>`

<td>

<input
type="number"
step="0.01"
value="${inputValue('consultoria',i,j)}"
onchange="setInput('consultoria',${i},${j},this.value)"
>

</td>

`).join('')}

<td>R$ 150/mês — ativo</td>

</tr>

`).join('')}

<tr>

<th>TOTAL CONSULTORIA</th>

${months.map((m,j)=>`

<th>${money(sumInputs('consultoria',j))}</th>

`).join('')}

<th></th>

</tr>

</tbody>

</table>

</div>

</section>


<section>

<div class="card form">

<div>

<label>Valor recebido do aplicativo</label>

<input
type="number"
step="0.01"
value="${db.inputs.app||0}"
onchange="db.inputs.app=n(this.value);save()"
>

</div>

</div>

</section>


<section>

<h2 class="title">Entradas Extras</h2>

<div class="card">

<form class="form" onsubmit="addEntradaExtra(event)">

<div>

<label>Data</label>

<input
id="extraData"
type="date"
required
>

</div>

<div>

<label>Descrição</label>

<input
id="extraDescricao"
type="text"
placeholder="Ex.: Venda do monitor"
required
>

</div>

<div>

<label>Valor</label>

<input
id="extraValor"
type="number"
step="0.01"
placeholder="500"
required
>

</div>

<div>

<label>&nbsp;</label>

<button type="submit">
Adicionar entrada
</button>

</div>

</form>

</div>

</section>


<section>

<h2 class="title">Entradas extras lançadas</h2>

<div class="card rows">

${
db.entries
.filter(e=>e.ym===ym()&&e.type==='entrada')
.map(e=>`

<div class="row">

<span>

${e.desc}

<small>
${e.date||''} · Entrada extra
</small>

</span>

<span>

<b class="green">
${money(e.amount)}
</b>

<button
class="danger"
onclick="removeEntry('${e.id}')"
>
×
</button>

</span>

</div>

`).join('')||'<div class="note">Nenhuma entrada extra.</div>'
}

</div>

</section>

`

}


/* =========================
   CONTROLE DAS ENTRADAS
   ========================= */

function inputValue(type,i,j){

let k=type+'_'+i+'_'+j;

return db.inputValues?.[k]??''

}

function setInput(type,i,j,v){

db.inputValues=db.inputValues||{};

db.inputValues[type+'_'+i+'_'+j]=n(v);

/*
O save() agora preserva automaticamente
a posição horizontal da tabela.
*/

save()

}

function sumInputs(type,j){

return db.inputs[type]
.reduce((s,_,i)=>s+n(inputValue(type,i,j)),0)

}


/* =========================
   ENTRADA EXTRA
   ========================= */

function addEntradaExtra(ev){

ev.preventDefault();

let data=ev.target.querySelector('#extraData').value;

let desc=ev.target.querySelector('#extraDescricao').value.trim();

let valor=n(ev.target.querySelector('#extraValor').value);

if(!data||!desc||!valor){

alert('Preencha data, descrição e valor.');

return

}

db.entries.push({

id:id(),

ym:data.slice(0,7),

type:'entrada',

amount:valor,

category:'Entrada Extra',

form:'Entrada',

desc:desc,

date:data

});

save()

}


/* =========================
   SAÍDAS
   ========================= */

function saídas(){

let fixed=pixFixed();

let cc=cardAll('casa');

let cp=cardAll('pessoal');

let inv=investments();

let res=reserve();

let others=db.entries
.filter(e=>
e.ym===ym()&&
e.type==='saida'&&
e.form==='Pix'&&
e.category!=='Investimentos'&&
e.category!=='Reserva de emergência'
)
.reduce((s,e)=>s+n(e.amount),0);

let tot=fixed+cc+cp+inv+res+others;

return monthNav()+`

<div class="grid">

<div class="card">
<div class="label">Gastos fixos — Pix</div>
<div class="big">${money(fixed)}</div>
</div>

<div class="card">
<div class="label">Cartão Casa</div>
<div class="big">${money(cc)}</div>
</div>

<div class="card">
<div class="label">Cartão Pessoal</div>
<div class="big">${money(cp)}</div>
</div>

<div class="card">
<div class="label">Total saídas</div>
<div class="big red">${money(tot)}</div>
</div>

</div>

<section>

<h2 class="title">Adicionar saída</h2>

<div class="card">

<form class="form" onsubmit="addEntry(event,'saida')">

<div>
<label>Valor</label>
<input id="ev" type="number" step="0.01" required>
</div>

<div>
<label>Categoria</label>

<select id="ec">

<option>Outros</option>
<option>Alimentação</option>
<option>Moradia</option>
<option>Transporte</option>
<option>Lazer</option>
<option>Saúde</option>
<option>Profissional</option>
<option>Investimentos</option>
<option>Reserva de emergência</option>

</select>

</div>

<div>

<label>Forma</label>

<select id="ef">

<option>Pix</option>
<option>Dinheiro</option>

</select>

</div>

<div>

<label>Descrição</label>

<input id="ed" required>

</div>

<div class="full">

<button>Adicionar saída</button>

</div>

</form>

</div>

</section>

<section>

<h2 class="title">Saídas lançadas no mês</h2>

<div class="card rows">

${
db.entries
.filter(e=>e.ym===ym()&&e.type==='saida')
.map(e=>`

<div class="row">

<span>

${e.desc}

<small>
${e.category} · ${e.form}
</small>

</span>

<span>

<b class="red">
-${money(e.amount)}
</b>

<button
class="danger"
onclick="removeEntry('${e.id}')"
>
×
</button>

</span>

</div>

`).join('')||'<div class="note">Nenhuma.</div>'
}

</div>

</section>

`

}

function addEntry(ev,type){

ev.preventDefault();

if(type==='saida'){

db.entries.push({

id:id(),

ym:ym(),

type:'saida',

amount:n(
ev.target.querySelector('#ev').value
),

category:
ev.target.querySelector('#ec').value,

form:
ev.target.querySelector('#ef').value,

desc:
ev.target.querySelector('#ed').value

})

}

save()

}


/* =========================
   CARTÕES
   ========================= */

function cardView(which){

let label=which==='casa'
?'Cartão Casa'
:'Cartão Pessoal';

let rows=db.cards[which];

return monthNav()+`

<div class="card">

<div class="note">

Lance uma compra uma única vez e informe o número de parcelas.
O app distribui automaticamente a parcela nos meses seguintes.

</div>

</div>

<section>

<h2 class="title">Nova compra / parcela</h2>

<div class="card">

<form class="form" onsubmit="addCard(event,'${which}')">

<div>

<label>Descrição</label>

<input id="cd" required>

</div>

<div>

<label>Valor total da compra</label>

<input id="cv" type="number" step="0.01" required>

</div>

<div>

<label>Parcelas</label>

<input id="cn" type="number" min="1" max="60" value="1" required>

</div>

function addCard(ev,which){

ev.preventDefault();

let f=ev.target;

let total=n(f.querySelector('#cv').value);

let inst=n(f.querySelector('#cn').value);

let start=f.querySelector('#cm').value;

let [y,m]=start.split('-').map(Number);

let monthsList=[];

for(let i=0;i<inst;i++){

let d=new Date(y,m-1+i,1);

monthsList.push(
d.getFullYear()+'-'+
String(d.getMonth()+1).padStart(2,'0')
);

}

db.cards[which].push({

id:id(),

desc:f.querySelector('#cd').value,

value:total,

installments:inst,

start,

months:monthsList,

category:f.querySelector('#cc').value

});

save()

}

function recurring(){

return monthNav()+`

<div class="card note">

Cadastro de referência.
Ele não entra no financeiro automaticamente.
O gasto real deve ser lançado no cartão, em Saídas,
ou transformado em uma compra/recorrência conforme o caso.

</div>

<section>

<div class="card">

<form class="form" onsubmit="addRec(event)">

<div>

<label>Categoria</label>

<select id="rc">

<option>Gastos fixos</option>
<option>Cartão Casa</option>
<option>Cartão Pessoal</option>

</select>

</div>

<div>

<label>Descrição</label>

<input id="rd" required>

</div>

<div>

<label>Forma</label>

<select id="rf">

<option>Pix</option>
<option>Cartão Casa</option>
<option>Cartão Pessoal</option>

</select>

</div>

<div>

<label>Valor mensal</label>

<input id="rv" type="number" step="0.01" required>

</div>

<div>

<label>Contar automaticamente?</label>

<option>Não</option>
<option>Sim</option>

</select>

</div>

Adicionar

</div>

</form>

</div>

</section>

<section>

<h2 class="title">Cadastros</h2>

<div class="tablewrap">

<table class="table">

<thead>

<tr>
<th>Categoria</th>
<th>Descrição</th>
<th>Forma</th>
<th>Mensal</th>
<th>Auto?</th>
<th>Observação</th>
<th></th>
</tr>

</thead>

<tbody>

${db.recurring.map((r,i)=>`

<tr>

<td>${r[0]}</td>
<td>${r[1]}</td>
<td>${r[2]}</td>

<td>${r[4]}</td>
<td>${r[5]}</td>

<button
class="danger"
onclick="db.recurring.splice(${i},1);save()"
>
Excluir
</button>

</td>

</tbody>

</table>

`

}

function addRec(ev){

ev.preventDefault();

let f=ev.target;

db.recurring.push([

f.querySelector('#rc').value,

f.querySelector('#rd').value,

f.querySelector('#rf').value,

n(f.querySelector('#rv').value),

f.querySelector('#ra').value,

''

]);

save()

}

function reserveView(){

let inc=income();

let min=inc*db.settings.reservePct/100;

let res=reserve();

let diff=res-min;

let acc=reserveAccum();

let target=averageFixed()*db.settings.emergencyMonths;

return monthNav()+`

<div class="grid">

<div class="card">

<div class="label">
Mínimo (${db.settings.reservePct}% da renda)
</div>

<div class="big">
${money(min)}
</div>

</div>

<div class="card">

<div class="label">
Valor reservado
</div>

<div class="big gold">
${money(res)}
</div>

</div>

<div class="card">

<div class="label">
Diferença
</div>

<div class="big ${diff>=0?'green':'red'}">
${money(diff)}
</div>

</div>

<div class="card">

<div class="label">
Meta de emergência
</div>

<div class="big">
${money(target)}
</div>

</div>

</div>

<section>

<h2 class="title">Lançar reserva</h2>

<div class="card">

<form class="form" onsubmit="addReserve(event)">

<div>

<label>Valor realmente reservado</label>

<input
id="rr"
type="number"
step="0.01"
required
>

</div>

<div class="full">

<button>
Registrar
</button>

</div>

</form>

</div>

</section>

<section>

<div class="card">

<div class="label">
Reserva acumulada
</div>

<div class="big gold">
${money(acc)}
</div>

<p class="note">
A reserva é lançada manualmente e não deve ser duplicada pelo cadastro de recorrentes.
</p>

</div>

</section>

`

}

function addReserve(ev){

ev.preventDefault();

db.entries.push({

id:id(),

ym:ym(),

type:'saida',

amount:n(
document.getElementById('rr').value
),

category:'Reserva de emergência',

form:'Reserva',

desc:'Reserva de emergência'

});

save()

}


/* =========================
   EXCLUSÕES
   ========================= */

function removeEntry(x){

db.entries=db.entries.filter(
e=>String(e.id)!==String(x)
);

save()

}

function removeCard(w,x){

db.cards[w]=db.cards[w].filter(
e=>String(e.id)!==String(x)
);

save()

}


/* =========================
   RENDER
   ========================= */

function render(){

tabs();

let a=
tab==='painel'
?panel()
:tab==='entradas'
?inputTable()
:tab==='saidas'
?saídas()
:tab==='casa'
?cardView('casa')
:tab==='pessoal'
?cardView('pessoal')
:tab==='recorrentes'
?recurring()
:reserveView();

document.getElementById('app').innerHTML=a

}

render();

if('serviceWorker'in navigator)
navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
